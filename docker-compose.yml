version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile 
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      - mongodb
  mongodb:
    container_name: ${DB_CONTAINER_NAME}
    image: "mongo:4.2.16-bionic"
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
